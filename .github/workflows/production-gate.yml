name: Build and Test

on:
  push:
    tags:
      - "v*"

jobs:
  test-and-build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-x86_64-release
          cache-on-failure: true

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Cargo check
        run: cargo check --workspace --target x86_64-pc-windows-msvc

      - name: Cargo test
        run: cargo test --workspace --target x86_64-pc-windows-msvc

      - name: Build frontend
        run: bun run build

      - name: Build Windows Agent
        run: cargo build --release -p msm-agent --target x86_64-pc-windows-msvc

      - name: Build Tauri app
        run: bun run installer:app

      - name: Package Windows Agent
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File packaging/windows/build-agent.ps1

[workspace]
members = ["src-tauri", "agent"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.77.2"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "6"
